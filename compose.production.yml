x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-WhatsMine}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Set APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Set APP_URL}
  APP_INSTALLED: "true"
  APP_LOCALE: pt
  APP_FALLBACK_LOCALE: pt
  APP_VERSION: "1.8.0"
  LICENSE_VERIFY: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-whatsmine}
  DB_USERNAME: ${DB_USERNAME:-whatsmine}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  FILESYSTEM_DISK: public
  REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET}
  REVERB_HOST: ${REVERB_HOST:?Set REVERB_HOST}
  REVERB_PORT: 443
  REVERB_SCHEME: https
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app-storage:/var/www/html/storage/app

services:
  app:
    <<: *app-service
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  worker:
    <<: *app-service
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=whatsapp,broadcast,automation,ai,social,leads,default
      - --sleep=2
      - --tries=3
      - --timeout=600
      - --max-time=3600
    healthcheck:
      disable: true

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  reverb:
    <<: *app-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    healthcheck:
      disable: true

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-whatsmine}
      MARIADB_USER: ${DB_USERNAME:-whatsmine}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

volumes:
  app-storage:
  database-data:
  redis-data:

